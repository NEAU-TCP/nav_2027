controller_server:
  ros__parameters:
    use_sim_time: True
    odom_topic: odometry
    controller_frequency: 100.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 6.28
    FollowPath:
      plugin: "minco_controller::MincoMpcController"
      dt: 0.05
      lookahead_time: 0.5
      use_small_gyro_mode: false
      deadzone_speed_threshold: 0.1
      control_delay_compensation: 0.05
      Q: [3.0, 3.0, 2.0]
      R: [1.5, 1.5, 1.0]
      vx_min: -3.0
      vx_max: 3.0
      vy_min: -3.0
      vy_max: 3.0
      fixed_wz: 0.0
      omega_min: -5.0
      omega_max: 5.0
      use_acc_constraints: true
      ax_min: -2.0
      ax_max: 2.0
      ay_min: -2.0
      ay_max: 2.0
      alpha_min: -5.0
      alpha_max: 5.0
      odom_frame: odom
      map_frame: map
      opt_path_topic: /opt_path
      opt_path_timeout: 0.8
      odom_topic: lidar_odometry
      cmd_vel_topic: cmd_vel_mpc


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: gimbal_yaw_fake
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.2
      plugins: ["static_layer", "rog_map_layer", "inflation_layer"]
      rog_map_layer:
        plugin: "rog_map_costmap_layer::RogMapLayer"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.7
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: gimbal_yaw_fake
      robot_radius: 0.2
      resolution: 0.05
      plugins: ["static_layer", "rog_map_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      rog_map_layer:
        plugin: "rog_map_costmap_layer::RogMapLayer"
        enabled: true
        topic: /rog_map/layer_value
        occupied_threshold: 50
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.7
      always_send_full_costmap: False

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
map_server:
  ros__parameters:
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 20.0
    planner_plugins: ["MincoPlanner"]
    MincoPlanner:
      plugin: "minco_planner/MincoPlanner"
      planner_mode: PRIORMAP
      frames:
        map_frame: map
        rog_frame: odom 
      priormap:
        use_nav2_global_search: true
        clip_seed_by_rog_boundary: true
        rog_boundary_margin: 0.2
        rog_boundary_sample_step: 0.1
      tolerance: 0.3
      use_smac: true
      allow_unknown: false
      use_internal_rog_map: true
      odom_topic: lidar_odometry
      lidar_offset_x: 0.0
      lidar_offset_y: -0.20
      rog_map:
        ros_callback:
          enable: true
          cloud_topic: registered_scan
          odom_topic: lidar_odometry
          odom_timeout: 2.0
          update_period_ms: 20
        cloud_filter:
          enable: false                      #是否开启点云滤波
          position_frame: odom
          robot_frame: base_footprint
          robot_pose_frame: front_mid360
          filter_mode: transform_center
          remove_inside: true                #删除框内点
          center_relative_to_robot: true
          filter_below_robot: false
          log_stats: true
          stats_log_period_ms: 1000           #0：每帧输出
          publish_visualization: true
          box_padding: 0.10
          position:
            x: 0.0
            y: 0.0
            z: 0.45
          box_size:
            x: 2.40         #m
            y: 2.40         #m
            z: 1.40         #m
        frame_id: odom
        resolution: 0.05
        inflation_resolution: 0.05     #地图分辨率

        map_size: [14.0, 14.0, 1.5]          #地图尺寸,m
        point_filt_num: 4
        # HERO/DOGMap-style fixed global window. The robot moves inside this
        # window; only the local raycasting and ESDF boxes below are updated.
        fixed_boundary:
          enable: true
          origin: [0.0, 0.0, 0.0]
          map_yaml: ""
          frame: map
          require_tf: false
        raycasting:
          enable: true
          batch_update_size: 1
          ray_range: [0.03, 10.0]       #射线有效距离,m
          local_update_box: [8.0, 8.0, 2.5]

          p_hit: 0.90
          p_miss: 0.45
          p_min: 0.12
          p_max: 0.97
          p_occ: 0.85
          p_free: 0.499
        decay:
          enable: true
          keep_time: 0.5
          clear_time: 1.2
          active_list_enable: false
        projection:
          enable: true
          scan_z_min_abs: 0.10           #odom系下z轴低于此值的体素不会被识别为障碍物,m
          scan_z_max_abs: 1.50           #odom系下z轴高于此值的体素不会被识别为障碍物,m
          unknown_as_occupied: false
          min_observed_voxels: 2
          passable_cost: 50
          passable_as_free: true
        esdf:
          enable: true
          resolution: 0.05
          local_update_box: [8.0, 8.0, 1.5]
        field:
          enable: true
          max_distance: 6.0
          min_distance: -3.0
          clamp_distance: true
          interpolation: quadratic
          inflation_radius: 0.0
          update_rate: 20.0
        visualization:
          enable: true
          rate: 10.0
          range: [8.0, 8.0, 1.5]
          frame_id: odom
      minco_optimizer:
        opt_freq: 20.0
        traj_goal_tolerance: 0.3
        enable_yaw_opt: true
        safe_dist: 0.35                    #优化轨迹期望距离障碍物多远
        collision_dist: 0.30                #小于该值的路径或轨迹被判定为碰撞
        lookahead_dist: 6.0                 
        max_velocity: 3.0
        max_acceleration: 2.0
        max_yaw_dot: 5.0
        turn_angle_deadzone: 0.1
        turn_angle_saturation: 0.8
        min_turn_vel: 0.7
        decay_power: 1.6
        time_allocation_iters: 15
        smooth_eps: 0.01
        integral_res: 16
        opt_accuracy: 0.001
        print_optimizer_log: false
        penalty_weight_time: 100.0
        penalty_weight_pos: 50000.0
        penalty_weight_vel: 1500.0
        penalty_weight_acc: 1500.0
        penalty_weight_att: 100.0
      corridor:
        robot_radius: 0.25
        extra_margin: 0.05
      smac_2d:
        use_esdf_cost: true
        esdf_weight: 1.0
        esdf_decay: 0.8
        esdf_max_cost: 0.5

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "pb_nav2_behaviors/BackUpFreeSpace"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: gimbal_yaw_fake
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    # params for pb_nav2_behaviors/BackUpFreeSpace
    service_name: "global_costmap/get_costmap"
    max_radius: 2.0
    visualize: false

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    enabled: false
    use_sim_time: True
    smoothing_frequency: 100.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [3.5, 3.5, 5.0]
    min_velocity: [-3.5, -3.5, -5.0]
    max_accel: [5.0, 5.0, 5.0]
    max_decel: [-5.0, -5.0, -5.0]
    odom_topic: "odometry"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
